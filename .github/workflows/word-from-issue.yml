# کاتێک خاوەنی پڕۆژە نیشانەی «پەسەندکراو» دەخاتە سەر پێشنیارێک، وشەکە ڕاستەوخۆ دەخرێتە ناو فەرهەنگەکە
name: word-from-issue
on:
  issues:
    types: [labeled]
permissions:
  contents: write
  issues: write
concurrency:
  group: glossary
  cancel-in-progress: false
jobs:
  add-word:
    # تەنها خاوەنی پڕۆژە دەتوانێت نیشانە دابنێت، بۆیە ئەمە پەسەندکردنی ئەوە
    if: github.event.label.name == 'پەسەندکراو' && contains(github.event.issue.labels.*.name, 'وشەی نوێ')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: زیادکردنی وشە
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set +e
          python tools/issue_to_entry.py > result.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat result.txt
      - name: وەڵام لە کاتی هەڵەدا
        if: steps.add.outputs.code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body-file result.txt
          exit 1
      - name: دروستکردنەوە و پاشەکەوتکردن
        if: steps.add.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/validate_glossary.py
          python build.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/kurdi-peti/references/glossary.json skills/kurdi-peti/references/glossary.md mcp/api/kp_check.py mcp/api/kp_data.py
          git commit -m "$(head -n1 result.txt)" -m "Closes #${{ github.event.issue.number }}"
          git push
          printf '%s\n\nسوپاس! وشەکە خرایە ناو فەرهەنگەکە. ✅\n' "$(head -n1 result.txt)" > done.txt
          gh issue close ${{ github.event.issue.number }} --comment "$(cat done.txt)"
